# Noty 수동 구성 (설치 마법사 대신 .env 로 직접 운영할 때)
# 보통은 deploy/install.sh → 어드민 설치 마법사를 쓴다. 이 파일은 같은 구성을 손으로 관리하고 싶을 때용이다.
#
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# - 앱 컨테이너(api, collab, admin)는 host 네트워크로 띄우고 모두 127.0.0.1 에만 연다.
#   그래서 같은 서버의 Ollama 등 외부 서비스에 http://127.0.0.1:<포트> 로 그대로 붙는다.
# - api 가 웹 화면, /api, /uploads, /collab(협업 서버로 전달)을 한 포트에서 맡는다.
#     127.0.0.1:4000 → 웹/API     127.0.0.1:4010 → admin
# - Ollama 는 Noty 와 별개로 운영한다. OLLAMA_URL 로 주소만 알려 주면 된다.
name: noty

x-app-env: &app-env
  DATABASE_URL: postgresql://noty:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 넣어 주세요}@127.0.0.1:${NOTY_DB_PORT:-5433}/noty
  NODE_ENV: production
  FILE_URL_SECRET: ${FILE_URL_SECRET:?FILE_URL_SECRET 를 .env 에 넣어 주세요}
  NOTY_ADMIN_PASSWORD: ${NOTY_ADMIN_PASSWORD:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  # 첫 시작 때의 AI 기본값. 이후에는 어드민에서 바꾼 값(DB)이 우선한다.
  AI_PROVIDER: ${AI_PROVIDER:-ollama}
  AI_MODEL: ${AI_MODEL:-qwen3:8b}
  AI_BASE_URL: ${OLLAMA_URL:-http://127.0.0.1:11434}
  AI_DIGEST_ENABLED: ${AI_DIGEST_ENABLED:-true}
  AI_BACKGROUND_PROVIDER: ${AI_BACKGROUND_PROVIDER:-ollama}
  AI_BACKGROUND_MODEL: ${AI_BACKGROUND_MODEL:-qwen3:8b}
  AI_BACKGROUND_BASE_URL: ${OLLAMA_URL:-http://127.0.0.1:11434}
  EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-true}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
  EMBEDDING_BASE_URL: ${OLLAMA_URL:-http://127.0.0.1:11434}

services:
  db:
    build: ../docker/postgres
    image: noty-postgres:pg17-pgroonga
    restart: unless-stopped
    environment:
      POSTGRES_USER: noty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: noty
    # host 네트워크로 두면 Postgres 가 모든 인터페이스에 열리므로, DB 만 bridge 로 두고 loopback 에만 연다.
    ports:
      - "127.0.0.1:${NOTY_DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../apps/server/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noty -d noty"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: { context: .., dockerfile: deploy/Dockerfile, target: app }
    image: noty-app:latest
    restart: unless-stopped
    network_mode: host
    command: ["npx", "tsx", "apps/server/index.ts"]
    environment:
      <<: *app-env
      HOST: ${NOTY_BIND_HOST:-127.0.0.1}
      PORT: ${NOTY_API_PORT:-4000}
      COLLAB_PORT: ${NOTY_COLLAB_PORT:-4001}
    volumes:
      - noty_data:/app/server-data
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 4000) + '/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  collab:
    image: noty-app:latest
    restart: unless-stopped
    network_mode: host
    command: ["npx", "tsx", "apps/server/collaboration.ts"]
    environment:
      <<: *app-env
      COLLAB_MODE: single
      COLLAB_HOST: 127.0.0.1
      COLLAB_PORT: ${NOTY_COLLAB_PORT:-4001}
      COLLAB_INSTANCE_NAME: noty-collab
    depends_on:
      # 스키마 준비는 api 가 시작하면서 끝낸다.
      api: { condition: service_healthy }

  admin:
    image: noty-app:latest
    restart: unless-stopped
    network_mode: host
    command: ["npx", "tsx", "apps/admin/server/index.ts"]
    environment:
      <<: *app-env
      ADMIN_HOST: 127.0.0.1
      ADMIN_PORT: ${NOTY_ADMIN_PORT:-4010}
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres_data:
  noty_data:
